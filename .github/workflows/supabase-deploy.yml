name: Supabase Deploy (Migrations + Edge Functions)

# Deploys the backend to the production Supabase project when a release lands on main:
# 1. pending migrations (`supabase db push`; never seeds or resets, AGENTS.md §10),
# 2. then every Edge Function in apps/supabase/functions.
# Migrations go first so functions never run against a schema they don't know yet.
# `supabase-ci.yml` already verified the same migrations on the release PR.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/supabase/migrations/**'
      - 'apps/supabase/functions/**'
      # verify_jwt and other per-function settings live here.
      - 'apps/supabase/config.toml'
  workflow_dispatch:

# Never cancel a running push: a half-applied deploy is worse than a queued one.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy migrations and Edge Functions to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link production project
        run: cd apps/supabase && supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # GitHub runners have no IPv6, and the direct db.<ref>.supabase.co host is IPv6-only.
      # `supabase link` records the IPv4 session pooler in .temp/pooler-url; push through it.
      - name: Resolve IPv4 pooler URL
        run: |
          cd apps/supabase
          pooler="$(cat supabase/.temp/pooler-url 2>/dev/null || cat .temp/pooler-url)"
          encoded="$(python3 -c 'import os,urllib.parse as u; print(u.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          echo "::add-mask::$encoded"
          url="$(echo "$pooler" | sed -E "s#^(postgres(ql)?://[^:@/]+)@#\\1:${encoded}@#")"
          echo "::add-mask::$url"
          echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"

      - name: Show pending migrations
        run: cd apps/supabase && supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Push migrations
        run: cd apps/supabase && supabase db push --db-url "$SUPABASE_DB_URL"

      # All functions, not only changed ones: _shared/ is imported by most of them, so a
      # change there needs every function redeployed. `--use-api` bundles on Supabase's
      # side (no Docker on the runner). No `--prune`: a function removed from the repo is
      # deleted by hand, never by CI.
      - name: Deploy Edge Functions
        run: cd apps/supabase && supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"
