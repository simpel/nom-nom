name: Supabase Deploy (Push Migrations)

# Applies pending migrations to the production Supabase project when a release
# lands on main. Only `supabase db push`: never seeds or resets (AGENTS.md §10).
# `supabase-ci.yml` already verified the same migrations on the release PR.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/supabase/migrations/**'
  workflow_dispatch:

# Never cancel a running push: a half-applied deploy is worse than a queued one.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link production project
        run: cd apps/supabase && supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: cd apps/supabase && supabase db push --dry-run

      - name: Push migrations
        run: cd apps/supabase && supabase db push
