name: Supabase CI (Verify Migrations & RLS)

# Feature PRs target release/* and skip this check (same pattern as CodeQL).
# It runs on the release PR into main only (not also on the release branch push,
# which would double every run), so a broken migration is caught before the
# Supabase integration deploys main.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/supabase/**'
      - '.github/workflows/supabase-*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Migrations & RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase local stack
        run: cd apps/supabase && supabase start

      - name: Verify clean migration reset
        run: cd apps/supabase && supabase db reset

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run RLS & Database Tests
        run: python3 apps/supabase/tests/rls_test.py

      - name: Stop Supabase stack
        if: always()
        run: cd apps/supabase && supabase stop
