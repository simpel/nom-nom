name: Supabase CI (Verify Migrations & RLS)

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Migrations & RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Verify clean migration reset
        run: supabase db reset

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RLS & Database Tests
        run: python3 supabase/tests/rls_test.py

      - name: Stop Supabase stack
        if: always()
        run: supabase stop
