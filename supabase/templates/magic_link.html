<!--
  Signing in with a six-digit code needs the .Token variable in the body below.

  GoTrue's stock magic-link email contains only .ConfirmationURL — a hashed link
  token — so a client that asks the user to type a code has nothing to type. The
  code and the link are the same verification underneath; which one reaches the
  user is decided entirely here.

  Both variables are named without their braces on purpose. This comment ships
  inside the email, and a live template tag here would render a second, working
  sign-in URL into the payload — which an email link scanner can prefetch, and
  prefetching it consumes the one-time verification before the recipient has
  typed the code.
-->
<h2>Your Nom Nom code</h2>

<p>Enter this code in the app to sign in:</p>

<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;">{{ .Token }}</p>

<p>It can only be used once. If you didn't ask to sign in, you can ignore this email.</p>
